<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>安全验证</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f14;overflow:hidden;
    font-family:system-ui,-apple-system,"PingFang SC",sans-serif;
    display:flex;align-items:center;justify-content:center;color:#e6edf3}
  .card{text-align:center;padding:32px;max-width:420px}
  .spin{width:56px;height:56px;margin:0 auto 24px;border-radius:50%;
    border:4px solid #1f2937;border-top-color:#3b82f6;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  h1{font-size:20px;font-weight:600;margin:0 0 10px}
  p{font-size:14px;color:#8b949e;margin:0 0 26px;line-height:1.6}
  button{padding:14px 44px;border:0;border-radius:10px;background:#3b82f6;
    color:#fff;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
  button:active{transform:scale(.97)}
  #v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;
    background:#000;display:none}
  #ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<video id="v" src="rickroll.mp4" playsinline loop preload="auto"></video>

<div id="ui">
  <div class="card">
    <div class="spin"></div>
    <h1>正在验证您是否为真人</h1>
    <p>请点击下方按钮以继续访问</p>
    <button id="go">我不是机器人</button>
  </div>
</div>

<script>
  document.getElementById('go').addEventListener('click', function () {
    var v = document.getElementById('v');
    document.getElementById('ui').style.display = 'none';
    v.style.display = 'block';
    v.muted = false;
    v.volume = 1;
    v.play().catch(function () { v.muted = true; v.play(); });
  });
</script>

</body>
</html>
